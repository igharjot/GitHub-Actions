name: Python Lint

on:
    push:
        branches:
            - main

jobs:
    validate:
        runs-on: ubuntu-latest
        
        strategy:
            fail-fast: false
            matrix:
                py-versions: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: setup python ${{ matrix.py-versions }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.py-versions }}

            - name: install dependencies
              run: pip install -r requirements.txt

            - name: run linter
              run: flake8 app.py