# Linting and SAST Scan
# Tools used :
# lint -  flake8
# SAST - Bandit

name: Code Quality

on:
    workflow_call:

jobs:
    validate:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                py-versions: ["3.11", "3.12", "3.13", "3.14"]
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: setup python ${{ matrix.py-versions }}
              uses: actions/setup-python@v5
              with:
                python-version: ${{ matrix.py-versions }}

            - name: install dependencies
              run: pip install -r requirements.txt

            - name: run linter
              run: flake8 app.py

            - name: run SAST
              run: bandit -r app.py