name: Deploy to server

on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
            DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
            DOCKER_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: SSH to Production Server and create app server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo "Installing required packages & folders"
            sudo apt-get update -y
            sudo apt-get install -y docker.io docker-compose
            sudo systemctl start docker
            sudo systemctl enable docker
            docker --version
            docker-compose --version
            sudo usermod -aG docker $USER
            mkdir -p ~/devops
      
      - name: Copy the 'docker-compose.yml' file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: docker-compose.yml
          target: ~/devops
         
      - name: SSH to Production Server and run the app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SSH_HOST }}
          username: ${{ secrets.EC2_SSH_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            echo "Running App"

            cd ~/devops

            echo DOCKERHUB_USER=${{ vars.DOCKERHUB_USER }} > .env
            echo DOCKER_TAG=${{ github.sha }} >> .env

            cat .env

            echo ${{ secrets.DOCKERHUB_TOKEN }} | sudo docker login --username ${{ vars.DOCKERHUB_USER }} --password-stdin

            sudo docker-compose --env-file .env pull
            sudo docker-compose --env-file .env up -d --force-recreate